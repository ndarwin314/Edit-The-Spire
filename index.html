<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit-the-Spire</title>
    <link href="https://fonts.googleapis.com/css2?family=Kreon:wght@300..700&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>

    <!-- STARTUP SCREEN -->
    <section id="startup-screen-page">
      <div class="title-container">
        <img id="title" src="src/assets/general/title.png" alt="Edit the Spire title text">
        <button id="btn-start" class="btn-primary">Continue</button>
      </div>
      <div class="title-spacer"> </div>
    </section>

    <!-- SAVE SELECTOR SCREEN -->
    <section id="save-selector-page" class="blurred-bg-page" hidden>
      <h1 class="save-page-title">Select a Save File</h1>
      <div class="save-grid" id="save-grid">
        <div class="save-card" char-name="The Ironclad">
          <div class="save-file-image">
            <div class="charcension">
              <h3 class="save-card-character"></h3>
              <div class="ascension" ascension-value="1"></div>
            </div>
          </div>
          <div class="save-card-bottom">
            <div class="floor-deck-stats">
              <div class="stat-item">
                <span class="stat-icon icon-floor"></span>
                <span class="floor-value" contenteditable="false" spellcheck="false">1</span>
              </div>
              <div class="stat-item">
                <span class="stat-icon icon-deck"></span>
                <span class="deck-value" contenteditable="false" spellcheck="false">10</span>
              </div>
            </div>
            <button type="button" class="file-select"></button>
          </div>
        </div>
      </div>
      <button type="button" class="back-button"></button>
    </section>

    <!-- SAVE EDITOR SCREEN(S) -->

      <!-- CHAR, STATS, INVENTORY TAB -->
    <section id="char-stats-inventory-page" class="blurred-bg-page" hidden>
      <header class="editor-header">
        <nav class="editor-tabs">
          <button type="button" class="tab-button active" id="stat-tab">Stats & Inventory</button>
          <button type="button" class="tab-button" id="deck-tab">Deck Editor</button>
          <button type="button" class="tab-button" id="card-tab">Card Library</button>
          <!--<button type="button" class="tab-button" id="map-tab">Map Editor</button>-->
        </nav>
      </header>

      <div class="char-stats-inventory-container" id="inventory-page" hidden>
        <div class="char-stats-container" char-name="The Ironclad" id="char-name">
          <div class="char-headshot">
            <div class="charcension">
              <h3 class="stat-card-character"></h3>
              <div class="ascension" ascension-value="1" id="ascension"></div>
            </div>
          </div>
          <div class="stat-item">
            <span class="stat-icon icon-hp"></span>
            <span class="stat-compound health-value">
              <span contenteditable="true" spellcheck="false" class="editable-val" id="current-hp">80</span>
              <span class="slash" contenteditable="false">/</span>
              <span contenteditable="true" spellcheck="false" class="editable-val" id="max-hp">80</span>
            </span>
          </div>
          <div class="stat-item">
            <span class="stat-icon icon-gold"></span>
            <span class="gold-value" contenteditable="true" spellcheck="false" id="gold">99</span>
          </div>
          <div class="stat-item">
            <span class="stat-icon icon-energy"></span>
            <span class="stat-compound energy-value">
              <span contenteditable="true" spellcheck="false" class="editable-val" id="energy">3</span>
            </span>
          </div>
        </div>

        <div class="inventory-container">
          <div class="potion-relic">
            <h2>Potions</h2>
            <div class="item-grid" id="potions">
              <button class="add-slot"></button>
            </div>
          </div>
          <div class="potion-relic">
            <h2 >Relics</h2>
            <div class="item-grid" id="relics">
              <div class="item-slot"><img src="src/assets/relics/burning_blood.webp"></div>
              <button class="add-slot"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="overlay save-changes-popup" id="save-changes-popup">
        <div class="save-changes-panel">
          <div class="save-changes-header">
            <h2>Save changes?</h2>
          </div>
          <div class="save-options">
            <div class="discard-changes">
              <span class="save-button-label">Discard</span>
            </div>
            <div class="save-changes">
              <span class="save-button-label">Save</span>
            </div>
          </div>
          <div class="continue-editing">
            <span class="save-button-label">Continue editing</span>
          </div>
        </div>
      </div>

      <div class="overlay potion-library" id="potion-library">
        <div class="library-panel">
          <div class="panel-header">
            <h2 class="panel-title">Potion Library</h2>
            <button class="close-button">✕</button>
          </div>
          <div class="panel-main">
            <div class="panel-toolbar">
              <div class="filter-group search-bar">
                <span class="filter-label">Search:</span>
                <div class="filter-row search-bar" contenteditable="plaintext-only" spellcheck="false" id="potion-search"></div>
              </div>
              <div class="filter-group rarity-filter">
                <span class="filter-label">Rarity:</span>
                <div class="filter-row rarity-filter" id="rarity-filters-potion">
                  <button class="filter-chip" data-value="common" aria-pressed="false">Common</button>
                  <button class="filter-chip" data-value="uncommon" aria-pressed="false">Uncommon</button>
                  <button class="filter-chip" data-value="rare" aria-pressed="false">Rare</button>
                  <button class="filter-chip" data-value="special" aria-pressed="false">Special</button>
                </div>
              </div>
              <div class="filter-group character-filter">
                <span class="filter-label">Character:</span>
                <div class="filter-row" id="character-filters-potion">
                  <button class="filter-chip icon-chip" data-value="any" aria-pressed="false">Any</button>
                  <button class="filter-chip icon-chip" data-value="ironclad" aria-pressed="false">
                    <img src="./src/assets/character-icons/character_icon_ironclad.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="silent" aria-pressed="false">
                    <img src="./src/assets/character-icons/character_icon_silent.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="regent" aria-pressed="false">
                    <img src="./src/assets/character-icons/character_icon_regent.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="necrobinder" aria-pressed="false">
                    <img src="./src/assets/character-icons/character_icon_necrobinder.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="defect" aria-pressed="false">
                    <img src="./src/assets/character-icons/character_icon_defect.webp"/>
                  </button>
                </div>
              </div>
            </div>
            <div class="item-grid"></div>
          </div>
        </div>
      </div>

      <div class="overlay relic-library" id="relic-library">
        <div class="library-panel">
          <div class="panel-header">
            <h2 class="panel-title">Relic Library</h2>
            <button class="close-button">✕</button>
          </div>
          <div class="panel-main">
            <div class="panel-toolbar">
              <div class="filter-group search-bar">
                <span class="filter-label">Search:</span>
                <div class="filter-row search-bar" id="relic-search" contenteditable="plaintext-only" spellcheck="false"></div>
              </div>
              <div class="filter-group rarity-filter">
                <span class="filter-label">Rarity:</span>
                <div class="filter-row rarity-filter" id="rarity-filters">
                  <button class="filter-chip" data-value="starter" aria-pressed="false">Starter</button>
                  <button class="filter-chip" data-value="common" aria-pressed="false">Common</button>
                  <button class="filter-chip" data-value="uncommon" aria-pressed="false">Uncommon</button>
                  <button class="filter-chip" data-value="rare" aria-pressed="false">Rare</button>
                  <button class="filter-chip" data-value="ancient" aria-pressed="false">Ancient</button>
                  <button class="filter-chip" data-value="shop" aria-pressed="false">Shop</button>
                  <button class="filter-chip" data-value="event" aria-pressed="false">Event</button>
                  <button class="filter-chip" data-value="special" aria-pressed="false">Special</button>
                </div>
              </div>
              <div class="filter-group character-filter">
                <span class="filter-label">Character:</span>
                <div class="filter-row" id="character-filters">
                  <button class="filter-chip icon-chip" data-value="any" aria-pressed="false">Any</button>
                  <button class="filter-chip icon-chip" data-value="ironclad" aria-pressed="false">
                    <img src="./src/assets/character-icons/character_icon_ironclad.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="silent" aria-pressed="false">
                    <img src="./src/assets/character-icons/character_icon_silent.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="regent" aria-pressed="false">
                    <img src="./src/assets/character-icons/character_icon_regent.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="necrobinder" aria-pressed="false">
                    <img src="./src/assets/character-icons/character_icon_necrobinder.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="defect" aria-pressed="false">
                    <img src="./src/assets/character-icons/character_icon_defect.webp"/>
                  </button>
                </div>
              </div>
              <div class="filter-group ancient-filter">
                <span class="filter-label">Ancients:</span>
                <div class="filter-row" id="ancient-filters">
                  <button class="filter-chip icon-chip" data-value="neow" aria-pressed="false">
                    <img src="./src/assets/ancient-icons/neow.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="orobas" aria-pressed="false">
                    <img src="./src/assets/ancient-icons/orobas.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="pael" aria-pressed="false">
                    <img src="./src/assets/ancient-icons/pael.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="tezcatara" aria-pressed="false">
                    <img src="./src/assets/ancient-icons/tezcatara.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="nonupeipe" aria-pressed="false">
                    <img src="./src/assets/ancient-icons/nonupeipe.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="tanx" aria-pressed="false">
                    <img src="./src/assets/ancient-icons/tanx.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="vakuu" aria-pressed="false">
                    <img src="./src/assets/ancient-icons/vakuu.webp"/>
                  </button>
                  <button class="filter-chip icon-chip" data-value="darv" aria-pressed="false">
                    <img src="./src/assets/ancient-icons/darv.webp"/>
                  </button>
                </div>
              </div>
            </div>
            <div class="item-grid"></div>
          </div>
        </div>
      </div>

        <!-- DECK TAB -->
      <div id="deck-page" hidden>
        <div class="top-bar-wrap">
          <button type="button" class="top-bar-buttons reset" id="reset-button">Reset Deck</button>
          <button type="button" class="top-bar-buttons card-library" id="card-library-button">Card Library</button>
          <div class="sort-bar">
            <div class="sort-chip">
              <span class="sort-label">Obtained</span>
              <span class="sort-icon" sort-order="descending"></span>
            </div>
            <div class="sort-chip">
              <span class="sort-label">Type</span>
              <span class="sort-icon" sort-order="descending"></span>
            </div>
            <div class="sort-chip">
              <span class="sort-label">Cost</span>
              <span class="sort-icon" sort-order="descending"></span>
            </div>
            <div class="sort-chip">
              <span class="sort-label">A-Z</span>
              <span class="sort-icon" sort-order="descending"></span>
            </div>
          </div>
        </div>
        <div class="card-grid" id="deck-grid"></div>
        <span class="deck-value" contenteditable="false" spellcheck="false">18 cards</span>
        <div class="overlay card-editor" id="card-editor">
          <div class="card-editor-panel">
            <button class="close-button card-editor">✕</button>
            <div class="card-entry" id="preview-card">
              <img class="card-image" src="./src/assets/card-renders/bash.webp">
              <div class="enchantment-badge">
                <span class="badge-value"></span>
              </div>
            </div>
            <div class="card-editor-button-group">
              <button type="button" class="card-editor-button" id="add-copy">
                <span class="card-editor-label">Add copy</span>
                <span class="card-editor-icon"></span>
              </button>
              <button type="button" class="card-editor-button" id="upgrade">
                <span class="card-editor-label">Upgrade</span>
                <span class="card-editor-icon"></span>
              </button>
              <button type="button" class="card-editor-button" id="enchant">
                <span class="card-editor-label">Enchant</span>
                <span class="card-editor-icon"></span>
              </button>
              <button type="button" class="card-editor-button" id="remove">
                <span class="card-editor-label">Remove</span>
                <span class="card-editor-icon"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="overlay enchant-selector" id="enchant-selector">
          <div class="enchant-selector-panel">
            <div class="panel-header">
              <h2 class="panel-title">Select an Enchantment</h2>
              <button class="close-button">✕</button>
            </div>
            <div class="enchant-grid">
              <img class="enchant-grid-item enchant-amount" data-value="adroit" src="src/assets/enchantment-badges/adroit.webp">
              <img class="enchant-grid-item" data-value="clone" src="src/assets/enchantment-badges/clone.webp">
              <img class="enchant-grid-item" data-value="corrupted" src="src/assets/enchantment-badges/corrupted.webp">
              <img class="enchant-grid-item" data-value="glam" src="src/assets/enchantment-badges/glam.webp">
              <img class="enchant-grid-item" data-value="goopy" src="src/assets/enchantment-badges/goopy.webp">
              <img class="enchant-grid-item" data-value="imbued" src="src/assets/enchantment-badges/imbued.webp">
              <img class="enchant-grid-item" data-value="inky" src="src/assets/enchantment-badges/inky.webp">
              <img class="enchant-grid-item" data-value="instinct" src="src/assets/enchantment-badges/instinct.webp">
              <img class="enchant-grid-item enchant-amount" data-value="momentum" src="src/assets/enchantment-badges/momentum.webp">
              <img class="enchant-grid-item enchant-amount" data-value="nimble" src="src/assets/enchantment-badges/nimble.webp">
              <img class="enchant-grid-item" data-value="perfect_fit" src="src/assets/enchantment-badges/perfect_fit.webp">
              <img class="enchant-grid-item" data-value="royally_approved" src="src/assets/enchantment-badges/royally_approved.webp">
              <img class="enchant-grid-item enchant-amount" data-value="sharp" src="src/assets/enchantment-badges/sharp.webp">
              <img class="enchant-grid-item" data-value="slither" src="src/assets/enchantment-badges/slither.webp">
              <!--
                <img class="enchant-grid-item enchant-amount" data-value="slumbering_essence" src="src/assets/enchantment-badges/slumbering_essence.webp">
              -->
              <img class="enchant-grid-item" data-value="souls_power" src="src/assets/enchantment-badges/souls_power.webp">
              <img class="enchant-grid-item" data-value="sown" src="src/assets/enchantment-badges/sown.webp">
              <img class="enchant-grid-item" data-value="spiral" src="src/assets/enchantment-badges/spiral.webp">
              <img class="enchant-grid-item" data-value="steady" src="src/assets/enchantment-badges/steady.webp">
              <img class="enchant-grid-item enchant-amount" data-value="swift" src="src/assets/enchantment-badges/swift.webp">
              <img class="enchant-grid-item" data-value="tezcataras_ember" src="src/assets/enchantment-badges/tezcataras_ember.webp">
              <img class="enchant-grid-item enchant-amount" data-value="vigorous" src="src/assets/enchantment-badges/vigorous.webp">
            </div>
            <div class="enchant-amount-editor">
              <img class="enchant-grid-item enchant-amount" id="chosen-enchantment" src="src/assets/enchantment-badges/nimble.webp" hidden>
              <div class="enchant-amount-box" hidden>
                <span contenteditable="true" spellcheck="false" class="editable-val" id="enchant-amount">2</span>
              </div>
            </div>
            <button type="button" class="confirm-button"></button>
          </div>
        </div>
      </div>

        <!-- CARD LIBRARY -->
      <div id="card-library" hidden>
        <div class="card-library-container">
          <div class="card-filter-panel">
            <div class="card-filter-group search-bar">
              <div class="card-filter-header">
                <span class="card-filter-label">Search:</span>
              </div>
              <div class="card-filter-row search-bar" contenteditable="plaintext-only" spellcheck="false" id="card-library-search"></div>
            </div>
            <div class="card-filter-group source-filter">
              <div class="card-filter-header">
                <span class="card-filter-label">Source:</span>
              </div>
              <div class="card-filter-row character-filter" id="source-filters">
                <button class="card-filter-chip icon-chip" data-value="ironclad" aria-pressed="false">
                  <img src="./src/assets/character-icons/character_icon_ironclad.webp"/>
                </button>
                <button class="card-filter-chip icon-chip" data-value="silent" aria-pressed="false">
                  <img src="./src/assets/character-icons/character_icon_silent.webp"/>
                </button>
                <button class="card-filter-chip icon-chip" data-value="regent" aria-pressed="false">
                  <img src="./src/assets/character-icons/character_icon_regent.webp"/>
                </button>
                <button class="card-filter-chip icon-chip" data-value="necrobinder" aria-pressed="false">
                  <img src="./src/assets/character-icons/character_icon_necrobinder.webp"/>
                </button>
                <button class="card-filter-chip icon-chip" data-value="defect" aria-pressed="false">
                  <img src="./src/assets/character-icons/character_icon_defect.webp"/>
                </button>
                <button class="card-filter-chip icon-chip" data-value="colorless" aria-pressed="false">
                  <img src="./src/assets/general/energy_colorless.webp"/>
                </button>
              </div>
            </div>
            <div class="card-filter-group rarity-filter">
              <div class="card-filter-header">
                <span class="card-filter-label">Rarity:</span>
              </div>
              <div class="card-filter-row rarity-filter" id="card-rarity-filters">
                <button class="card-filter-chip" data-value="basic" aria-pressed="false">Basic</button>
                <button class="card-filter-chip" data-value="common" aria-pressed="false">Common</button>
                <button class="card-filter-chip" data-value="uncommon" aria-pressed="false">Uncommon</button>
                <button class="card-filter-chip" data-value="rare" aria-pressed="false">Rare</button>
                <button class="card-filter-chip" data-value="ancient" aria-pressed="false">Ancient</button>
                <button class="card-filter-chip" data-value="event" aria-pressed="false">Event</button>
                <button class="card-filter-chip" data-value="token" aria-pressed="false">Token</button>
              </div>
            </div>
            <div class="card-filter-group type">
              <div class="card-filter-header">
                <span class="card-filter-label">Type:</span>
              </div>
              <div class="card-filter-row type-filter" id="card-type-filters">
                <button class="card-filter-chip" data-value="attack" aria-pressed="false">Attack</button>
                <button class="card-filter-chip" data-value="skil" aria-pressed="false">Skill</button>
                <button class="card-filter-chip" data-value="power" aria-pressed="false">Power</button>
                <button class="card-filter-chip" data-value="status" aria-pressed="false">Status</button>
                <button class="card-filter-chip" data-value="curse" aria-pressed="false">Curse</button>
                <button class="card-filter-chip" data-value="quest" aria-pressed="false">Quest</button>
              </div>
            </div>
            <div class="card-filter-group cost">
              <div class="card-filter-header">
                <span class="card-filter-label">Cost:</span>
              </div>
              <div class="card-filter-row cost-filter" id="card-cost-filters">
                <button class="card-filter-chip" data-value="0" aria-pressed="false">0</button>
                <button class="card-filter-chip" data-value="1" aria-pressed="false">1</button>
                <button class="card-filter-chip" data-value="2" aria-pressed="false">2</button>
                <button class="card-filter-chip" data-value="3" aria-pressed="false">3+</button>
                <button class="card-filter-chip" data-value="x" aria-pressed="false">X</button>
                <button class="card-filter-chip" data-value="unplayable" aria-pressed="false">Unplayable</button>
              </div>
            </div>
            <!-- <button type="button" class="back-button"></button> -->
          </div>
          <div class="card-grid item-grid" id="library-grid"></div>
        </div>
      </div>

        <!-- MAP TAB -->
      <div id="map-page" hidden>
        
      </div>

      <button type="button" class="save-button"></button>
    </section>

  </body>
</html>
