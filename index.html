<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit-the-Spire</title>
    <link href="https://fonts.googleapis.com/css2?family=Kreon:wght@300..700&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>

    <!-- STARTUP SCREEN --- INCOMPLETE -->
    <section id="startup-screen-page" hidden>
      <div class="title-container">
        <img id="title" src="src/assets/title.png" alt="Edit the Spire title text">
        <button id="btn-start" class="btn-primary">Continue</button>
      </div>
      <div class="title-spacer">
    </section>

    <!-- SAVE SELECTOR SCREEN --- COMPLETE -->
    <section id="save-selector-page" class="blurred-bg-page" hidden>
      <h1 class="save-page-title">Select a Save File</h1>
      <div class="save-grid" id="save-grid">

        <div class="save-card" char-name="The Ironclad">
          <div class="save-file-image">
            <div class="charcension">
              <h3 class="save-card-character"></h3>
              <div class="ascension" ascension-value="1"></div>
            </div>
          </div>
          <div class="save-card-bottom">
            <div class="floor-deck-stats">
              <div class="stat-item">
                <span class="stat-icon icon-floor"></span>
                <span class="floor-value" contenteditable="false" spellcheck="false">1</span>
              </div>
              <div class="stat-item">
                <span class="stat-icon icon-deck"></span>
                <span class="deck-value" contenteditable="false" spellcheck="false">10</span>
              </div>
            </div>
            <button type="button" class="file-select"></button>
          </div>
        </div>
      </div>
      <button type="button" class="back-button"></button>
    </section>

    <!-- CHARACTER, STATS, and INVENTORY SCREEN --- COMPLETE -->
    <section id="char-stats-inventory-page" class="blurred-bg-page">
      <header class="editor-header">
        <nav class="editor-tabs">
          <button type="button" class="tab-button active" id="stat-tab">Stats & Inventory</button>
          <button type="button" class="tab-button" id="deck-tab">Deck Editor</button>
          <button type="button" class="tab-button" id="map-tab">Map Editor</button>
        </nav>
      </header>

      <div class="char-stats-inventory-container" id="inventory-page">
        <div class="char-stats-container" char-name="The Ironclad" id="char-name">
          <div class="char-headshot">
            <div class="charcension">
              <h3 class="stat-card-character"></h3>
              <div class="ascension" ascension-value="1" id="ascension"></div>
            </div>
          </div>
          <div class="stat-item">
            <span class="stat-icon icon-hp"></span>
            <span class="stat-compound health-value">
              <span contenteditable="true" spellcheck="false" class="editable-val" id="current-hp">80</span>
              <span class="slash" contenteditable="false">/</span>
              <span contenteditable="true" spellcheck="false" class="editable-val" id="max-hp">80</span>
            </span>
          </div>

          <div class="stat-item">
            <span class="stat-icon icon-gold"></span>
            <span class="gold-value" contenteditable="true" spellcheck="false" id="gold">99</span>
          </div>

          <div class="stat-item">
            <span class="stat-icon icon-energy"></span>
            <span class="stat-compound energy-value">
              <span contenteditable="true" spellcheck="false" class="editable-val" id="energy">3</span>
            </span>
          </div>
        </div>

        <div class="inventory-container">
          <div class="potion-relic">
            <h2>Potions</h2>
            <div class="item-grid" id="potions">
              <div class="item-slot"><img src="src/assets/potions/fire_potion.webp"></div>
              <div class="item-slot"><img src="src/assets/potions/strength_potion.webp"></div>
              <div class="item-slot"><img src="src/assets/potions/potion_placeholder.webp"></div>

              <button class="add-slot"></button>
            </div>
          </div>

          <div class="potion-relic">
            <h2 >Relics</h2>
            <div class="item-grid" id="relics">
              <div class="item-slot"><img src="src/assets/relics/burning_blood.webp"></div>
              <button class="add-slot"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- DECK SCREEN --- INCOMPLETE -->
      <div id="deck-page" hidden>
      </div>

      <!-- MAP SCREEN --- INCOMPLETE ! -->
      <div id="map-page" hidden>
      </div>

      <button type="button" class="back-button"></button>
    </section>

  </body>
</html>
