<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit-the-Spire</title>
    <link href="https://fonts.googleapis.com/css2?family=Kreon:wght@300..700&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>

    <!-- STARTUP SCREEN --- INCOMPLETE -->
    <section id="startup-screen-page" class="blurred-bg-page">

      <div class="hero-container">
        <img id="title" src="src/assets/title.png" alt="Edit the Spire title text">
        <button id="btn-start" class="btn-primary">Continue</button>
      </div>
    </section>

    <!-- SAVE SELECTOR SCREEN --- INCOMPLETE -->
    <section id="save-selector-page" class="blurred-bg-page" hidden>
      <h1>Select a Save File</h1>
      <div class="save-grid">
        <div class="save-card">
          <h3>Slot 1: The Ironclad</h3>
          <p>Floor 42 - Ascension 9</p>
          <button type="button" class="file-select">Select</button>
        </div>

        <div class="save-card">
          <h3>Slot 2: The Silent</h3>
          <p>Floor 12 - Ascension 5</p>
          <button type="button" class="file-select">Select</button>
        </div>
      </div>
      <button type="button" class="back-button"></button>
      <div class="save-list">

      </div>
    </section>

    <!-- CHARACTER, STATS, and INVENTORY SCREEN --- COMPLETE -->
    <section id="char-stats-inventory-page" class="blurred-bg-page" hidden>
      <header class="editor-header">
        <nav class="editor-tabs">
          <button id="stat-tab" type="button" class="tab-button active">Stats & Inventory</button>
          <button id="deck-tab" type="button" class="tab-button">Deck Editor</button>
        </nav>
      </header>

      <div class="char-stats-inventory-container">
        <div class="char-stats-container">
          <img id="char-headshot" src="src/assets/ironclad.png">
          <div class="stat-item">
            <span class="stat-icon icon-hp"></span>
            <span class="stat-compound health-value">
              <span contenteditable="true" spellcheck="false" class="editable-val">80</span>
              <span class="slash" contenteditable="false">/</span>
              <span contenteditable="true" spellcheck="false" class="editable-val">80</span>
            </span>
          </div>

          <div class="stat-item">
            <span class="stat-icon icon-gold"></span>
            <span class="gold-value" contenteditable="true" spellcheck="false">99</span>
          </div>

          <div class="stat-item">
            <span class="stat-icon icon-energy"></span>
            <span class="stat-compound energy-value">
              <span contenteditable="true" spellcheck="false" class="editable-val">3</span>
              <span class="slash" contenteditable="false">/</span>
              <span contenteditable="true" spellcheck="false" class="editable-val">3</span>
            </span>
          </div>
        </div>

        <div class="inventory-container">
          <div class="potion-relic">
            <h2>Potions</h2>
            <div class="item-grid">
              <div class="item-slot"><img src="src/assets/potions/fire_potion.webp"></div>
              <div class="item-slot"><img src="src/assets/potions/strength_potion.webp"></div>
              <div class="item-slot"><img src="src/assets/potions/potion_placeholder.webp"></div>
            </div>
          </div>

          <div class="potion-relic">
            <h2>Relics</h2>
            <div class="item-grid">
              <div class="item-slot"><img src="src/assets/relics/burning_blood.webp"></div>
            </div>
          </div>
        </div>
      </div>

      <button type="button" class="back-button"></button>
    </section>

    <!-- DECK SCREEN --- INCOMPLETE -->
    <section id="deck-page" class="blurred-bg-page" hidden>
      <button type="button" class="back-button"></button>
    </section>

    <!-- MAP SCREEN --- INCOMPLETE ! -->
    <section id="map-page" class="blurred-bg-page" hidden>
      <button type="button" class="back-button"></button>
    </section>

  </body>
</html>
