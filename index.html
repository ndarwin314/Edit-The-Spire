<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit-the-Spire</title>
    <link href="https://fonts.googleapis.com/css2?family=Kreon:wght@300..700&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>

    <!-- STARTUP SCREEN --- INCOMPLETE -->
    <section id="startup-screen-page">
      <div class="title-container">
        <img id="title" src="src/assets/general/title.png" alt="Edit the Spire title text">
        <button id="btn-start" class="btn-primary">Continue</button>
      </div>
      <div class="title-spacer"> </div>
    </section>

    <!-- SAVE SELECTOR SCREEN --- COMPLETE -->
    <section id="save-selector-page" class="blurred-bg-page" hidden>
      <h1 class="save-page-title">Select a Save File</h1>
      <div class="save-grid" id="save-grid">

        <div class="save-card" char-name="The Ironclad">
          <div class="save-file-image">
            <div class="charcension">
              <h3 class="save-card-character"></h3>
              <div class="ascension" ascension-value="1"></div>
            </div>
          </div>
          <div class="save-card-bottom">
            <div class="floor-deck-stats">
              <div class="stat-item">
                <span class="stat-icon icon-floor"></span>
                <span class="floor-value" contenteditable="false" spellcheck="false">1</span>
              </div>
              <div class="stat-item">
                <span class="stat-icon icon-deck"></span>
                <span class="deck-value" contenteditable="false" spellcheck="false">10</span>
              </div>
            </div>
            <button type="button" class="file-select"></button>
          </div>
        </div>
      </div>
      <button type="button" class="back-button"></button>
    </section>

    <!-- CHARACTER, STATS, and INVENTORY SCREEN --- COMPLETE -->
    <section id="char-stats-inventory-page" class="blurred-bg-page" hidden>
      <header class="editor-header">
        <nav class="editor-tabs">
          <button type="button" class="tab-button active" id="stat-tab">Stats & Inventory</button>
          <button type="button" class="tab-button" id="deck-tab">Deck Editor</button>
          <button type="button" class="tab-button" id="map-tab">Map Editor</button>
        </nav>
      </header>

      <div class="char-stats-inventory-container" id="inventory-page" hidden>
        <div class="char-stats-container" char-name="The Ironclad" id="char-name">
          <div class="char-headshot">
            <div class="charcension">
              <h3 class="stat-card-character"></h3>
              <div class="ascension" ascension-value="1" id="ascension"></div>
            </div>
          </div>
          <div class="stat-item">
            <span class="stat-icon icon-hp"></span>
            <span class="stat-compound health-value">
              <span contenteditable="true" spellcheck="false" class="editable-val" id="current-hp">80</span>
              <span class="slash" contenteditable="false">/</span>
              <span contenteditable="true" spellcheck="false" class="editable-val" id="max-hp">80</span>
            </span>
          </div>
          <div class="stat-item">
            <span class="stat-icon icon-gold"></span>
            <span class="gold-value" contenteditable="true" spellcheck="false" id="gold">99</span>
          </div>
          <div class="stat-item">
            <span class="stat-icon icon-energy"></span>
            <span class="stat-compound energy-value">
              <span contenteditable="true" spellcheck="false" class="editable-val" id="energy">3</span>
            </span>
          </div>
        </div>

        <div class="inventory-container">
          <div class="potion-relic">
            <h2>Potions</h2>
            <div class="item-grid" id="potions">
              <div class="item-slot"><img src="src/assets/potions/fire_potion.webp"></div>
              <div class="item-slot"><img src="src/assets/potions/strength_potion.webp"></div>
              <div class="item-slot"><img src="src/assets/potions/potion_placeholder.webp"></div>
              <button class="add-slot"></button>
            </div>
          </div>
          <div class="potion-relic">
            <h2 >Relics</h2>
            <div class="item-grid" id="relics">
              <div class="item-slot"><img src="src/assets/relics/burning_blood.webp"></div>
              <button class="add-slot"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="overlay-library relic-library" id="potion-library" hidden>
        <div class="library-panel">
          <div class="panel-header">
            <h2 class="panel-title">Potion Library</h2>
            <button class="close-button">✕</button>
          </div>
        <div class="item-grid">
          </div>
        </div>
      </div>

      <div class="overlay relic-library" id="relic-library" hidden>
        <div class="library-panel">
          <div class="panel-header">
            <h2 class="panel-title">Relic Library</h2>
            <button class="close-button">✕</button>
          </div>
          <div class="panel-toolbar">
            <div class="filter-group search-bar">
              <span class="filter-label">Search:</span>
              <div class="filter-row search-bar"></div>
            </div>
            <div class="filter-group rarity-filter">
              <span class="filter-label">Rarity:</span>
              <div class="filter-row rarity-filter">
                <button class="filter-chip" data-value="starter">Starter</button>
                <button class="filter-chip" data-value="common">Common</button>
                <button class="filter-chip" data-value="uncommon">Uncommon</button>
                <button class="filter-chip" data-value="rare">Rare</button>
                <button class="filter-chip" data-value="ancient">Ancient</button>
                <button class="filter-chip" data-value="shop">Shop</button>
                <button class="filter-chip" data-value="event">Event</button>
                <button class="filter-chip" data-value="special">Special</button>
              </div>
            </div>
            <div class="filter-group character-filter">
              <span class="filter-label">Character:</span>
              <div class="filter-row">
                <button class="filter-chip icon-chip" data-value="any">Any</button>
                <button class="filter-chip icon-chip" data-value="ironclad">
                  <img src="./src/assets/character-icons/character_icon_ironclad.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="silent">
                  <img src="./src/assets/character-icons/character_icon_silent.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="regent">
                  <img src="./src/assets/character-icons/character_icon_regent.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="necrobinder">
                  <img src="./src/assets/character-icons/character_icon_necrobinder.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="defect">
                  <img src="./src/assets/character-icons/character_icon_defect.webp"/>
                </button>
              </div>
            </div>
            <div class="filter-group ancient-filter">
              <span class="filter-label">Ancients:</span>
              <div class="filter-row">
                <button class="filter-chip icon-chip" data-value="neow">
                  <img src="./src/assets/ancient-icons/neow.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="orobas">
                  <img src="./src/assets/ancient-icons/orobas.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="pael">
                  <img src="./src/assets/ancient-icons/pael.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="tezcatara">
                  <img src="./src/assets/ancient-icons/tezcatara.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="nonupeipe">
                  <img src="./src/assets/ancient-icons/nonupeipe.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="tanx">
                  <img src="./src/assets/ancient-icons/tanx.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="vakuu">
                  <img src="./src/assets/ancient-icons/vakuu.webp"/>
                </button>
                <button class="filter-chip icon-chip" data-value="darv">
                  <img src="./src/assets/ancient-icons/darv.webp"/>
                </button>
              </div>
            </div>
          </div>
          <div class="item-grid">
          </div>
        </div>
      </div>

      <!-- DECK SCREEN --- INCOMPLETE -->
      <div id="deck-page" hidden>
      </div>

      <!-- MAP SCREEN --- INCOMPLETE ! -->
      <div id="map-page" hidden>
      </div>

      <button type="button" class="back-button"></button>
    </section>

  </body>
</html>
